{% extends "base.html" %}
{% block title %}Unsubscribed | Appertivo{% endblock %}
{% block content %}
<section class="page-width py-16">
  <div class="mx-auto max-w-xl rounded-2xl bg-white p-8 shadow-sm">
    <p class="eyebrow">Email preferences</p>
    <h1 class="mt-2 text-4xl">You're unsubscribed</h1>
    <p class="mt-4 text-stone-600">{{ email }} will no longer receive Appertivo diner digest emails.</p>
    <a href="{{ url_for('home') }}" class="button-primary mt-6 inline-flex">Back to today's specials</a>
  </div>
</section>
{% endblock %}
